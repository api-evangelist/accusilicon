aid: accusilicon
name: Accusilicon
description: 'Accusilicon (Guangzhou Ruixin Microelectronics Co., Ltd. / 广州睿芯微电子有限公司) is a
  fabless mixed-signal semiconductor company founded in July 2014 and headquartered in the Huangpu
  district of Guangzhou, China, with additional sites in Xi''an and Shanghai. It designs and sells
  ultra-low phase noise timing silicon and related analog ICs — XO/VCXO/TCXO and OCXO oscillator
  chips, clock ICs, crystal-oscillator modules, RF and analog switch ICs, mobile-interface protection
  ICs, ADC/DAC converters, digital audio processor (DSP) and audio ICs, and spectral image sensor
  chips — alongside clock stability analyzers and other test and measurement instruments, and ASIC/SoC,
  module, system and clock custom design services. Its parts are used in smartphones, digital
  communications and high-speed Ethernet, audio/video and professional audiophile equipment, medical,
  security, payment and measurement systems. The company is a hardware component supplier: it operates
  a corporate marketing site in Chinese only and publishes no developer program, developer portal, API
  documentation, SDK or machine-readable API description of any kind.'
